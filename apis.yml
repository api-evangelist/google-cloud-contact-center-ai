aid: google-cloud-contact-center-ai
name: Google Cloud Contact Center AI
description: >-
  Google Cloud Contact Center AI (CCAI) provides AI-powered solutions for contact centers, enabling virtual agents,
  agent assist capabilities, and insights from customer conversations. It combines Dialogflow, speech-to-text,
  text-to-speech, and natural language processing to improve customer service.
